name: Node.js

# Build this fork's Node.js 24.x for the three 32-bit platforms nodejs.org does
# not publish a binary for, and attach one executable per platform to the
# GitHub Release of that version — the same shape wekan/FerretDB's
# release-all.yml has: individual per-arch assets, no zip, so a consumer
# downloads only the one file for the platform it targets.
#
#   node-i386    32-bit x86      (--dest-cpu=x86)
#   node-armhf   32-bit ARM      hard-float, VFPv3-D16 — the Debian armhf
#                                baseline, so it runs on any ARMv7-A without
#                                assuming NEON
#   node-armv7   32-bit ARM      hard-float, NEON — ARMv7-A tuned, for boards
#                                that have it
#   node-loong64 LoongArch64     (--dest-cpu=loong64) — V8 has the port, nobody
#                                publishes the binary
#   node-win32.exe 32-bit Windows — upstream REMOVED the build in 7ad0cc3e571;
#                                this fork puts the removed pieces back and
#                                builds it with ClangCL
#
# armhf and armv7 are both 32-bit hard-float ARM: the difference is the FPU
# baseline, which is the difference that matters on the older boards this exists
# for. Keeping both is deliberate.
#
# NOTHING has been removed from this fork's source for these platforms - the
# support is upstream's and it is intact:
#   * configure.py's valid_arch still has `arm`, `ia32` and `x86`, and
#     --with-arm-float-abi / --with-arm-fpu still take their full range;
#   * V8's 32-bit ports are present (deps/v8/src/codegen/arm and .../ia32);
#   * BUILDING.md lists x86 and armv7 as Experimental - which means "buildable,
#     not released", not "gone". The only commit that ever removed a 32-bit
#     target was 7ad0cc3e571, and that is 32-bit WINDOWS.
# So what was missing was the BUILD, not the code, and that is what this adds.
#
# What is deliberately NOT here, of the platforms wekan/FerretDB builds for:
#   armel (ARMv5, soft-float) - V8 has not supported ARMv5 for many years. There
#     is no Node.js for it anywhere and this fork cannot make one either; a build
#     target that can only ever fail is worse than an honest gap.
#   win-arm64 / win64 - nodejs.org publishes both, so there is nothing to add.
#   mac-* and freebsd-* - likewise their own hosts. macOS x64 and arm64 are on
#     nodejs.org already; FreeBSD builds Node from ports.
#
# Run it from the Actions page (Run workflow) or:
#   gh workflow run node.yml -f version=v24.18.1
#
# Leave `version` empty and it is read from src/node_version.h, which is what
# the release commit for a version sets - so the default is always "the version
# this branch IS".

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, e.g. v24.18.1 (empty = read src/node_version.h)'
        required: false
        type: string
      publish:
        description: 'Attach the binaries to the GitHub Release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

# Two runs against one release would race on the same assets. A second run waits
# for the first rather than clobbering it half way through.
concurrency:
  group: node-32bit-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  # One job per platform, so the three build in PARALLEL and one failing does
  # not take the other two down (fail-fast: false) - a platform that breaks is
  # then a single red job with its own log, not "the build failed".
  build:
    name: build ${{ matrix.platform }}
    # 350, not the 300 this started with: the ARM containers run under QEMU and
    # a full Node build there is hours. 360 is the ceiling GitHub allows, and a
    # job that is killed at 300 having done five hours of work tells nobody
    # anything. ../log/node/TODO.txt says what to do if even this is not enough.
    # Linux platforms cross compile (or build in a container) on the Linux
    # runner; win32 needs a Windows one with MSVC, so the runner comes from the
    # matrix rather than being fixed.
    runs-on: ${{ matrix.runs_on || 'ubuntu-latest' }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          # 32-bit x86 builds INSIDE an i386 container rather than cross
          # compiling: an x86_64 CPU runs i386 code natively, so this is a
          # native build at native speed, and configure sees a real i386 host
          # instead of having to be told it is cross compiling.
          #
          # `docker run`, NOT the job-level `container:` key: the Actions runner
          # injects its own x86_64 Node.js into a job container to run the
          # actions with, and an i386 image has no 64-bit loader to start it -
          # checkout itself would fail. Checking out on the HOST and compiling
          # in the container keeps the actions on x64 and the compiler on i386.
          - platform: i386
            mode: container
            image: i386/debian:bookworm
            docker_platform: linux/386
            # --openssl-no-asm: deps/openssl's pregenerated x86 assembly is
            # written for NASM - `%ifdef __CET__` and friends - and the build
            # feeds those .S files to GNU as, which answers "junk at end of
            # line, first unrecognized character is `%'" for every one of them.
            # Nobody has assembled these since nodejs.org stopped building
            # linux-x86, so they rotted. The C implementations are slower at
            # crypto and they compile.
            configure_flags: --dest-cpu=x86 --dest-os=linux --openssl-no-asm
          # 32-bit ARM builds AS the target, in an armhf container, and NOT by
          # cross compiling - which was tried and cannot work with this build
          # system. V8 says so itself, in deps/v8/include/v8config.h:
          #
          #     #if (V8_TARGET_ARCH_ARM && !(V8_HOST_ARCH_IA32 || V8_HOST_ARCH_ARM))
          #     #error Target architecture arm is only supported on arm and ia32 host
          #
          # An ARM32 target therefore needs an ARM or 32-bit x86 HOST. V8's own
          # GN build gets around that with a simulator build; node's GYP files
          # have no USE_SIMULATOR anywhere, so that door is shut here. The cross
          # attempt failed exactly there, compiling out/Release/obj.host.
          #
          # So the container is the answer, as it is for i386 - except that an
          # x86_64 runner has no ARM CPU, so this one runs under QEMU and is
          # SLOW. See ../log/node/TODO.txt: if it does not fit in the job limit,
          # the fix is a builder that is actually 32-bit-ARM-capable, which is
          # how nodejs.org's own armv7 builds are made.
          - platform: armhf
            mode: container
            image: arm32v7/debian:bookworm
            docker_platform: linux/arm/v7
            configure_flags: >-
              --dest-cpu=arm --dest-os=linux
              --with-arm-float-abi=hard --with-arm-fpu=vfpv3-d16
          - platform: armv7
            mode: container
            image: arm32v7/debian:bookworm
            docker_platform: linux/arm/v7
            configure_flags: >-
              --dest-cpu=arm --dest-os=linux
              --with-arm-float-abi=hard --with-arm-fpu=neon
          # LoongArch64. Node has supported it since configure.py learned
          # `loong64` and V8 carries a full port (deps/v8/src/codegen/loong64),
          # but neither nodejs.org nor unofficial-builds publishes a binary - so
          # a LoongArch machine has no runtime to run anything Node with, which
          # is exactly the gap this fork exists to fill. wekan/FerretDB builds
          # for loong64, so WeKan can now ship a bundle for it.
          # LoongArch64 DOES cross compile - v8config.h allows a loong64 target
          # on an x64 host, unlike ARM32 above - but Ubuntu has no
          # gcc-loongarch64-linux-gnu to cross compile WITH: the first run
          # answered "E: Unable to locate package". Debian trixie has it, so the
          # cross build happens inside a Debian container on the x64 runner.
          # The container is the toolchain, not the target: this is still a
          # cross compile and still runs at native speed.
          - platform: loong64
            mode: cross-container
            image: debian:trixie
            triple: loongarch64-linux-gnu
            apt_packages: gcc-loongarch64-linux-gnu g++-loongarch64-linux-gnu
            configure_flags: --dest-cpu=loong64 --dest-os=linux --cross-compiling
          # 32-bit Windows. nodejs.org stopped publishing it and upstream removed
          # the build itself in 7ad0cc3e571 ("build: remove support for 32-bit
          # Windows"); this fork puts the removed pieces back - see the commit
          # that adds this job for what and why. wekan/FerretDB builds win32, so
          # a 32-bit Windows machine has a database and, with this, a runtime.
          #
          # Built with ClangCL, not cl.exe: V8's ia32 stack-scanning routine is
          # `push_registers_asm.cc`, whose Windows branch is written in Clang's
          # inline-asm syntax. The masm file the upstream removal referenced no
          # longer exists in this V8, so Clang is not a preference here.
          - platform: win32
            mode: windows
            runs_on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # Only the ARM containers need it: an x86_64 runner runs i386 natively,
      # and the loong64 build is a CROSS compile in a Debian container, so it
      # runs at native speed too. Registering binfmt for a CPU that is not
      # emulated costs a step and buys nothing.
      - name: Set up QEMU
        if: matrix.docker_platform == 'linux/arm/v7'
        uses: docker/setup-qemu-action@v3

      - name: Build (in a container of the target architecture)
        if: matrix.mode == 'container'
        run: |
          set -euo pipefail
          # The build tools INSIDE the target's own image, so the compiler, the
          # linker and every library are the target's - and, which is the point,
          # so is the HOST as far as V8 is concerned. V8 refuses an ia32 or ARM32
          # target on any other host (deps/v8/include/v8config.h), so this is not
          # a convenience: it is the only arrangement that builds.
          #
          # i386 needs no emulation - an x86_64 CPU runs it natively. The ARM
          # containers do, through the QEMU registered above, and are slow for
          # it.
          docker run --rm --platform ${{ matrix.docker_platform }} \
            -v "$PWD":/src -w /src \
            -e MAKEFLAGS="-j$(nproc)" \
            ${{ matrix.image }} \
            sh -c '
              set -eu
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential python3 ninja-build ca-certificates
              ./configure ${{ matrix.configure_flags }}
              make -j"$(nproc)"
              strip out/Release/node
            '

      - name: Build (cross compile, in a container that has the toolchain)
        if: matrix.mode == 'cross-container'
        run: |
          set -euo pipefail
          # The container supplies the CROSS COMPILER, not the CPU: this runs on
          # the runner's own x86_64 and produces loong64 objects, so it is as
          # fast as any other cross build. CC_host/CXX_host are the host half of
          # the split toolset - mksnapshot and the other build tools have to run
          # here, so they are built with the container's native compiler while
          # everything shipped is built with the cross one.
          docker run --rm -v "$PWD":/src -w /src \
            -e CC="${{ matrix.triple }}-gcc" \
            -e CXX="${{ matrix.triple }}-g++" \
            -e AR="${{ matrix.triple }}-ar" \
            -e RANLIB="${{ matrix.triple }}-ranlib" \
            -e LINK="${{ matrix.triple }}-g++" \
            -e CC_host=gcc -e CXX_host=g++ \
            ${{ matrix.image }} \
            sh -c '
              set -eu
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential python3 ninja-build ca-certificates \
                ${{ matrix.apt_packages }}
              ./configure ${{ matrix.configure_flags }}
              make -j"$(nproc)"
              ${{ matrix.triple }}-strip out/Release/node
            '

      - name: Build (32-bit Windows)
        if: matrix.mode == 'windows'
        shell: cmd
        run: |
          call vcbuild.bat x86 clang-cl release
          if errorlevel 1 exit /b 1

      - name: Name it for the release, and say what it is
        if: matrix.mode != 'windows'
        run: |
          set -euo pipefail
          mkdir -p dist
          cp out/Release/node "dist/node-${{ matrix.platform }}"
          chmod +x "dist/node-${{ matrix.platform }}"
          # `file` on the result is the one check worth having in the log: it is
          # how a build that quietly produced an x86_64 binary - because a
          # cross-compile flag was dropped - is caught before it is published as
          # an ARM one.
          file "dist/node-${{ matrix.platform }}"
          ls -l "dist/node-${{ matrix.platform }}"

      - name: Name it for the release (Windows)
        if: matrix.mode == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # `.exe`, like wekan/FerretDB's win32 asset: a Windows binary without
          # it is not executable by double-click and confuses every tool that
          # goes by extension.
          cp Release/node.exe "dist/node-${{ matrix.platform }}.exe"
          ls -l "dist/node-${{ matrix.platform }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.platform }}
          path: dist/node-${{ matrix.platform }}*
          if-no-files-found: error
          retention-days: 7

  # Every binary that built, attached to the release of this version, with the
  # notes composed here. `always()` so two good platforms are still published
  # when a third fails - the release then simply lists the two it has.
  publish:
    name: attach to the release
    needs: build
    if: ${{ always() && inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve the version
        id: ver
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            # src/node_version.h is what the release commit for a version sets,
            # so this is always the version the branch actually is.
            MAJOR=$(sed -n 's/^#define NODE_MAJOR_VERSION \([0-9]*\).*/\1/p' src/node_version.h)
            MINOR=$(sed -n 's/^#define NODE_MINOR_VERSION \([0-9]*\).*/\1/p' src/node_version.h)
            PATCH=$(sed -n 's/^#define NODE_PATCH_VERSION \([0-9]*\).*/\1/p' src/node_version.h)
            V="v${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Release version: $V"

      - name: Compose the release notes
        id: notes
        env:
          # It asks the release what it already carries, so the notes describe
          # what will be downloadable rather than only what this run built.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          BARE="${V#v}"                 # 24.18.1
          MAJOR="${BARE%%.*}"           # 24

          # 1. Which platforms the release will CARRY once this run has
          #    uploaded - which is not the same as which ones this run built.
          #
          #    A re-run replaces the binaries it built (gh release upload
          #    --clobber, below) and leaves the others alone, so after a partial
          #    run the release holds a mix: today's for the platforms that built
          #    now, an earlier run's for the rest. Notes written from dist/ alone
          #    would list only the first group, and somebody downloading one of
          #    the others would find a binary the notes never mention.
          #
          #    So it is the UNION: what is in dist/ now, plus what is already
          #    attached to the release. The log says which is which, because
          #    "this one is older than the notes above it" is worth knowing.
          # `|| true`: when EVERY build fails there are no artifacts, dist/ does
          # not exist, and `ls` exits 2 - which under `set -e` killed this step
          # with a bare "Process completed with exit code 2" and no word about
          # what was actually wrong. The empty case is handled below, where it
          # can say so.
          built="$( (ls dist 2>/dev/null || true) | sed -n 's#^node-\(.*\)#\1#p' | sed 's#\.exe$##' | sort -u)"
          existing="$( (gh release view "$V" --json assets \
                          --jq '.assets[].name' 2>/dev/null || true) \
                        | sed -n 's#^node-\(.*\)#\1#p' | sed 's#\.exe$##' | sort -u)"
          # Empty lines filtered on BOTH sides: with nothing built, `printf` still
          # prints one, and an empty string would then be reported as a platform.
          kept="$(comm -13 <(printf '%s\n' $built | sed '/^$/d' | sort -u) \
                           <(printf '%s\n' $existing | sed '/^$/d' | sort -u) | tr '\n' ' ')"
          echo "Built by this run:            ${built:-(none)}"
          echo "Already on the release:       ${existing:-(none)}"
          echo "Kept from an earlier run:     ${kept:-(none)}"
          # ONE PLATFORM PER LINE. `$built` and `$existing` are space-separated,
          # so printing them as two lines leaves "i386 loong64" as a single line
          # - and the loop below matches with `grep -qx`, which wants the whole
          # line, so every platform would fail to match and the list would come
          # out empty.
          present="$(printf '%s\n%s\n' "$built" "$existing" | tr ' ' '\n' | sed '/^$/d' | sort -u)"
          plats=""
          for a in i386 armhf armv7 loong64 win32; do
            printf '%s\n' "$present" | grep -qx "$a" && plats="${plats:+$plats }$a"
          done
          for a in $present; do
            printf ' %s ' "i386 armhf armv7 loong64 win32" | grep -q " $a " || plats="${plats:+$plats }$a"
          done
          if [ -z "$plats" ]; then
            echo "::error::No platform produced a binary - every build job failed. Their logs say why; nothing is published."
            exit 1
          fi
          # Comma-separated for the `Platforms:` line, which is the form the
          # FerretDB releases use; the sentence above it keeps the plain spaces
          # it is read as.
          plats_csv="$(printf '%s' "$plats" | sed 's/ /, /g')"

          # 2. The upstream release notes for this exact version, out of the
          #    changelog this fork carries. Sections are anchored
          #    `<a id="24.18.1"></a>` and run to the next `<a id="`, which is a
          #    firmer boundary than the `## <date>, Version ...` heading.
          CHANGELOG="doc/changelogs/CHANGELOG_V${MAJOR}.md"
          : > upstream-notes.md
          if [ -f "$CHANGELOG" ]; then
            awk -v ver="$BARE" '
              $0 ~ ("^<a id=\"" ver "\"></a>") { inblock=1; next }
              inblock && /^<a id="/ { exit }
              inblock { print }
            ' "$CHANGELOG" > upstream-notes.md
            sed -i -e '/./,$!d' upstream-notes.md
          fi
          if [ ! -s upstream-notes.md ]; then
            echo "::warning::No $CHANGELOG section for $BARE - the notes will carry the header only."
          fi

          # 3. The header xet7 asked for, then the platforms, then upstream's
          #    own notes for that version underneath.
          {
            echo "Node.js JavaScript runtime ✨🐢🚀✨"
            echo ""
            echo "$plats that are not at https://nodejs.org/dist/$V/ and https://unofficial-builds.nodejs.org/download/release/$V/"
            echo ""
            echo "Platforms: $plats_csv"
            echo ""
            echo "Built by node.yml from the wekan/node fork. One node-<platform> executable per platform, no archive. Re-running the workflow replaces the binaries it rebuilds, in place, on this same release."
            echo ""
            cat upstream-notes.md
          } > release-notes.md

          echo "----- release notes for $V -----"
          cat release-notes.md
          echo "notes_file=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create or update the release, with a binary per platform
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          NOTES_FILE="${{ steps.notes.outputs.notes_file }}"
          shopt -s nullglob
          assets=(dist/node-*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::No binaries were built - nothing to publish."
            exit 1
          fi
          # --clobber is what makes a re-run REPLACE: an asset of the same name
          # is overwritten in place rather than the upload failing on it, so
          # the release always carries the newest binary built for a platform.
          # Without it a fixed build could not be published to the release the
          # broken one is already attached to.
          # --target pins a NEW tag to the commit that was built rather than to
          # whatever the default branch has moved to since.
          if gh release view "$V" >/dev/null 2>&1; then
            gh release upload "$V" "${assets[@]}" --clobber
            gh release edit "$V" --title "$V" --notes-file "$NOTES_FILE"
          else
            gh release create "$V" "${assets[@]}" \
              --title "$V" \
              --target "${{ github.sha }}" \
              --notes-file "$NOTES_FILE"
          fi
