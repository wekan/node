name: Node.js

# Build this fork's Node.js 24.x for EVERY platform WeKan ships a bundle for, and
# attach one executable per platform to the GitHub Release of that version — the
# same shape wekan/FerretDB's release-all.yml has: individual per-arch assets, no
# zip, so a consumer downloads only the one file for the platform it targets.
#
# WHY ALL OF THEM, when nodejs.org publishes several. Two reasons.
#
# The fixes. CHANGELOG-fork.md lists what this fork carries that upstream does
# not, and they are not all 32-bit-only: the ICU, /SAFESEH and zlib flag fixes
# are build-configuration fixes that any platform benefits from. WeKan takes its
# Node.js from here for every bundle now, and a bundle set should not be half
# built on one Node.js and half on another depending on which CPU it is for.
#
# The backstop. A fallback only works if it covers everything. When nodejs.org
# or unofficial-builds has not published a version yet — riscv64 was two
# releases behind when this was written, and unofficial-builds had only x64-musl
# for v24.19.0 — the fork is what fills the gap, and it can only fill a gap it
# builds.
#
#   node-x64       64-bit x86 Linux          native
#   node-arm64     64-bit ARM Linux          native
#   node-i386      32-bit x86                (--dest-cpu=x86)
#   node-armhf     32-bit ARM                hard-float, VFPv3-D16 — the Debian
#                                            armhf baseline, so it runs on any
#                                            ARMv7-A without assuming NEON
#   node-armv7     32-bit ARM                hard-float, NEON — ARMv7-A tuned,
#                                            for boards that have it
#   node-ppc64le   PowerPC 64 LE             cross
#   node-s390x     IBM Z                     cross
#   node-riscv64   RISC-V 64                 cross
#   node-loong64   LoongArch64               (--dest-cpu=loong64) — V8 has the
#                                            port, nobody else publishes it
#   node-win64.exe 64-bit Windows
#   node-win32.exe 32-bit Windows            upstream REMOVED the build in
#                                            7ad0cc3e571; this fork puts the
#                                            removed pieces back, ClangCL
#   node-mac-x64   macOS Intel               native
#   node-mac-arm64 macOS Apple silicon       native
#
# armhf and armv7 are both 32-bit hard-float ARM: the difference is the FPU
# baseline, which is the difference that matters on the older boards this exists
# for. Keeping both is deliberate.
#
# NOTHING has been removed from this fork's source for these platforms - the
# support is upstream's and it is intact:
#   * configure.py's valid_arch still has `arm`, `ia32` and `x86`, and
#     --with-arm-float-abi / --with-arm-fpu still take their full range;
#   * V8's 32-bit ports are present (deps/v8/src/codegen/arm and .../ia32);
#   * BUILDING.md lists x86 and armv7 as Experimental - which means "buildable,
#     not released", not "gone". The only commit that ever removed a 32-bit
#     target was 7ad0cc3e571, and that is 32-bit WINDOWS.
# So what was missing was the BUILD, not the code, and that is what this adds.
#
# What is deliberately NOT here, of the platforms wekan/FerretDB builds for:
#   armel (ARMv5, soft-float) - V8 has not supported ARMv5 for many years. There
#     is no Node.js for it anywhere and this fork cannot make one either; a build
#     target that can only ever fail is worse than an honest gap.
#   win-arm64 / win64 - nodejs.org publishes both, so there is nothing to add.
#   freebsd-* - it needs a FreeBSD host, and there is no FreeBSD runner. FreeBSD
#     builds Node from ports, which is the answer there anyway.
#   (macOS used to be on this list, on the grounds that nodejs.org publishes it.
#   It is built here now, for the two reasons at the top: the fork's fixes, and
#   a backstop that covers everything.)
#
# A release carries exactly ONE run's binaries. Re-running replaces what it
# rebuilds and deletes what it does not, so the assets on a release are never a
# mixture of builds from different days - which is what makes a failing platform
# possible to debug at all.
#
# Run it from the Actions page (Run workflow) or:
#   gh workflow run node.yml -f version=v24.18.1
#
# Leave `version` empty and it is read from src/node_version.h, which is what
# the release commit for a version sets - so the default is always "the version
# this branch IS".

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, e.g. v24.18.1 (empty = read src/node_version.h)'
        required: false
        type: string
      publish:
        description: 'Attach the binaries to the GitHub Release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

# Two runs against one release would race on the same assets. A second run waits
# for the first rather than clobbering it half way through.
concurrency:
  group: node-32bit-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  # One job per platform, so the three build in PARALLEL and one failing does
  # not take the other two down (fail-fast: false) - a platform that breaks is
  # then a single red job with its own log, not "the build failed".
  build:
    name: build ${{ matrix.platform }}
    # Linux platforms cross compile (or build in a container) on the Linux
    # runner; win32 needs a Windows one with MSVC, so the runner comes from the
    # matrix rather than being fixed.
    runs-on: ${{ matrix.runs_on || 'ubuntu-latest' }}
    # The rule is still "roughly twice a good build" - a hang should be stopped,
    # not left to burn the runner's whole allowance - but the number is per
    # platform now, and MEASURED rather than predicted. A flat 180 was set when
    # no build had yet run far enough to time, on the reasoning that nothing is
    # emulated any more so every job compiles at the runner's own speed. Half of
    # that held: nothing is emulated. What it missed is that a CROSS build
    # compiles V8 TWICE - once for the host, to get mksnapshot, and once for the
    # target - and for ARM the host half is itself 32-bit.
    #
    # The sixth run measured all four: win32 22 min, i386 115, loong64 148, and
    # armhf/armv7 killed at 180 with the target compiles ~85% done, an hour of
    # which had gone on the host half alone. i386 is the fast one because it is
    # the only Linux job that is NOT a cross build - a native i386 container has
    # no host toolset to build.
    #
    # ARM gets 360 rather than twice its build, because 360 is the ceiling: a
    # job on a GitHub-hosted runner is killed at six hours whatever this says.
    # It cannot be avoided by cross compiling from a 64-bit host either - V8
    # refuses, "Target architecture arm is only supported on arm and ia32 host"
    # (deps/v8/include/v8config.h), so the ia32 host container is forced and its
    # slow host half with it.
    timeout-minutes: ${{ matrix.timeout_minutes || 180 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 32-bit x86 builds INSIDE an i386 container rather than cross
          # compiling: an x86_64 CPU runs i386 code natively, so this is a
          # native build at native speed, and configure sees a real i386 host
          # instead of having to be told it is cross compiling.
          #
          # `docker run`, NOT the job-level `container:` key: the Actions runner
          # injects its own x86_64 Node.js into a job container to run the
          # actions with, and an i386 image has no 64-bit loader to start it -
          # checkout itself would fail. Checking out on the HOST and compiling
          # in the container keeps the actions on x64 and the compiler on i386.
          - platform: i386
            mode: container
            image: i386/debian:bookworm
            docker_platform: linux/386
            # --openssl-no-asm: deps/openssl's pregenerated x86 assembly is
            # written for NASM - `%ifdef __CET__` and friends - and the build
            # feeds those .S files to GNU as, which answers "junk at end of
            # line, first unrecognized character is `%'" for every one of them.
            # Nobody has assembled these since nodejs.org stopped building
            # linux-x86, so they rotted. The C implementations are slower at
            # crypto and they compile.
            configure_flags: --dest-cpu=x86 --dest-os=linux --openssl-no-asm
            timeout_minutes: 240        # measured 115: native container, no host toolset
          # 32-bit ARM CROSS COMPILES, from a 32-bit x86 host. V8 states the
          # rule itself, in deps/v8/include/v8config.h:
          #
          #     #if (V8_TARGET_ARCH_ARM && !(V8_HOST_ARCH_IA32 || V8_HOST_ARCH_ARM))
          #     #error Target architecture arm is only supported on arm and ia32 host
          #
          # An ARM32 target needs an ARM or a 32-bit x86 host - and ia32 IS
          # allowed, which is what this uses. The half that was missing before
          # is in deps/v8/src/common/globals.h:
          #
          #     #if (V8_TARGET_ARCH_ARM && !V8_HOST_ARCH_ARM)
          #     #define USE_SIMULATOR 1
          #
          # V8 turns its ARM simulator on BY ITSELF whenever the host is not
          # ARM, so mksnapshot - a host binary that has to run ARM code to
          # write the snapshot - simulates it. Nothing in the gyp files has to
          # ask for that, and the earlier x64-host attempt did not fail for
          # want of a simulator: it failed on the v8config.h check above,
          # because an x86_64 host is not one of the two hosts it allows.
          #
          # This replaces the arm32v7-container-under-QEMU build these two jobs
          # used to be. That one could never have finished: ../log/node3/armhf.txt
          # is still compiling V8 five hours and fifty minutes in when the
          # 350-minute limit kills it, and six hours is GitHub's ceiling for a
          # job. The i386 container is not emulated - an x86_64 runner runs
          # i386 natively - so the compiler runs at full speed and only the
          # snapshot is simulated.
          #
          # What it costs: a cross build cannot run the binary it just made, so
          # configure turns node_use_node_snapshot off (it does the same for
          # loong64) and these two start a little slower than a natively built
          # node. V8's own snapshot is still there - that is the simulated one
          # above. A runtime that starts slightly slower beats the one nobody
          # can build.
          - platform: armhf
            mode: cross-container
            image: i386/debian:bookworm
            docker_platform: linux/386
            triple: arm-linux-gnueabihf
            apt_packages: gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
            configure_flags: >-
              --dest-cpu=arm --dest-os=linux --cross-compiling
              --with-arm-float-abi=hard --with-arm-fpu=vfpv3-d16
            timeout_minutes: 360        # measured >180, ~85% of the target compiles done; 360 is the runner ceiling
          - platform: armv7
            mode: cross-container
            image: i386/debian:bookworm
            docker_platform: linux/386
            triple: arm-linux-gnueabihf
            apt_packages: gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
            configure_flags: >-
              --dest-cpu=arm --dest-os=linux --cross-compiling
              --with-arm-float-abi=hard --with-arm-fpu=neon
            timeout_minutes: 360        # measured >180, ~88% of the target compiles done; 360 is the runner ceiling
          # LoongArch64. Node has supported it since configure.py learned
          # `loong64` and V8 carries a full port (deps/v8/src/codegen/loong64),
          # but neither nodejs.org nor unofficial-builds publishes a binary - so
          # a LoongArch machine has no runtime to run anything Node with, which
          # is exactly the gap this fork exists to fill. wekan/FerretDB builds
          # for loong64, so WeKan can now ship a bundle for it.
          # LoongArch64 DOES cross compile - v8config.h allows a loong64 target
          # on an x64 host, unlike ARM32 above - but Ubuntu has no
          # gcc-loongarch64-linux-gnu to cross compile WITH: the first run
          # answered "E: Unable to locate package". Debian trixie has it, so the
          # cross build happens inside a Debian container on the x64 runner.
          # The container is the toolchain, not the target: this is still a
          # cross compile and still runs at native speed.
          - platform: loong64
            mode: cross-container
            image: debian:trixie
            triple: loongarch64-linux-gnu
            apt_packages: gcc-loongarch64-linux-gnu g++-loongarch64-linux-gnu
            # --openssl-no-asm: deps/openssl ships ONE loongarch config and it
            # is config/archs/linux64-loongarch64/no-asm - there is no asm one.
            # openssl_asm.gypi has no loong64 branch either, so with asm the
            # build silently fell through to its default, linux-x86_64/asm, and
            # handed the LoongArch compiler x86_64 flags: "loongarch64-linux-gnu-gcc:
            # error: unrecognized command-line option '-m64'". Asking for the
            # no-asm build is asking for the only openssl this architecture has.
            configure_flags: >-
              --dest-cpu=loong64 --dest-os=linux --cross-compiling
              --openssl-no-asm
            timeout_minutes: 300        # measured 148: cross build, but its host half is native amd64
          # ── The architectures somebody else also builds ──────────────────
          #
          # These are on nodejs.org (x64, arm64, ppc64le, s390x) or on
          # unofficial-builds (riscv64, loong64) already, so for a long time this
          # fork did not build them: there was nothing to add.
          #
          # What changed is WHY the fork exists. It is no longer only "the CPUs
          # nobody publishes" - it is where WeKan takes its Node.js from, for
          # every platform, because the fixes in CHANGELOG-fork.md are fixes
          # every platform benefits from and a bundle should not be built on two
          # different Node.js builds depending on which CPU it is for. And a
          # backstop only works if it covers everything: when nodejs.org or
          # unofficial-builds has not published a version yet - riscv64 was two
          # releases behind when this was written - the fork is what fills the
          # gap, and it can only fill a gap it builds.
          #
          # x64 and arm64 build natively on a runner of their own CPU. The rest
          # cross compile in a container that carries the toolchain, exactly as
          # loong64 does above: the container is the toolchain, not the target,
          # so these run at the runner's own speed.
          - platform: x64
            mode: native
            runs_on: ubuntu-24.04
            configure_flags: ''
            timeout_minutes: 240
          - platform: arm64
            mode: native
            runs_on: ubuntu-24.04-arm
            configure_flags: ''
            timeout_minutes: 240
          - platform: ppc64le
            mode: cross-container
            image: debian:trixie
            triple: powerpc64le-linux-gnu
            apt_packages: gcc-powerpc64le-linux-gnu g++-powerpc64le-linux-gnu
            configure_flags: >-
              --dest-cpu=ppc64 --dest-os=linux --cross-compiling
            timeout_minutes: 300
          - platform: s390x
            mode: cross-container
            image: debian:trixie
            triple: s390x-linux-gnu
            apt_packages: gcc-s390x-linux-gnu g++-s390x-linux-gnu
            configure_flags: >-
              --dest-cpu=s390x --dest-os=linux --cross-compiling
            timeout_minutes: 300
          # riscv64: openssl has no riscv64 asm config either, same story as
          # loong64 - ask for the no-asm build, which is the only one there is.
          - platform: riscv64
            mode: cross-container
            image: debian:trixie
            triple: riscv64-linux-gnu
            apt_packages: gcc-riscv64-linux-gnu g++-riscv64-linux-gnu
            configure_flags: >-
              --dest-cpu=riscv64 --dest-os=linux --cross-compiling
              --openssl-no-asm
            timeout_minutes: 300
          # 64-bit Windows. On nodejs.org, and built here for the same reason as
          # the rest: WeKan's win64 bundle should carry the same Node.js as
          # every other bundle.
          - platform: win64
            mode: windows
            runs_on: windows-2022
            vcbuild_arch: x64
            timeout_minutes: 240
          # macOS. Both are on nodejs.org; built here so the mac-arm64 bundle is
          # not the one platform taking its Node.js from somewhere else.
          - platform: mac-x64
            mode: mac
            runs_on: macos-13
            timeout_minutes: 240
          - platform: mac-arm64
            mode: mac
            runs_on: macos-14
            timeout_minutes: 240
          # 32-bit Windows. nodejs.org stopped publishing it and upstream removed
          # the build itself in 7ad0cc3e571 ("build: remove support for 32-bit
          # Windows"); this fork puts the removed pieces back - see the commit
          # that adds this job for what and why. wekan/FerretDB builds win32, so
          # a 32-bit Windows machine has a database and, with this, a runtime.
          #
          # Built with ClangCL, not cl.exe: V8's ia32 stack-scanning routine is
          # `push_registers_asm.cc`, whose Windows branch is written in Clang's
          # inline-asm syntax. The masm file the upstream removal referenced no
          # longer exists in this V8, so Clang is not a preference here.
          - platform: win32
            mode: windows
            runs_on: windows-2022
            vcbuild_arch: x86
    steps:
      - uses: actions/checkout@v4

      # There is no QEMU step any more, and there is nothing left to register
      # it for: i386 and the i386 cross containers run natively on an x86_64
      # runner, and loong64 is a cross compile in an x86_64 container. Every
      # job here builds on the CPU it is running on.

      - name: Build (in a container of the target architecture)
        if: matrix.mode == 'container'
        run: |
          set -euo pipefail
          # The build tools INSIDE the target's own image, so the compiler, the
          # linker and every library are the target's - and, which is the point,
          # so is the HOST as far as V8 is concerned. V8 refuses an ia32 target
          # on any other host (deps/v8/include/v8config.h), so this is not a
          # convenience: it is the only arrangement that builds.
          #
          # i386 needs no emulation - an x86_64 CPU runs it natively.
          docker run --rm --platform ${{ matrix.docker_platform }} \
            -v "$PWD":/src -w /src \
            -e MAKEFLAGS="-j$(nproc)" \
            ${{ matrix.image }} \
            sh -c '
              set -eu
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential python3 ninja-build ca-certificates
              ./configure ${{ matrix.configure_flags }}
              make -j"$(nproc)"
              strip out/Release/node
            '

      - name: Build (cross compile, in a container that has the toolchain)
        if: matrix.mode == 'cross-container'
        run: |
          set -euo pipefail
          # The container supplies the CROSS COMPILER, not the CPU: this runs on
          # the runner's own x86_64 and produces loong64 or ARM32 objects, so it
          # is as fast as any other cross build. CC_host/CXX_host are the host
          # half of the split toolset - mksnapshot and the other build tools
          # have to run here, so they are built with the container's native
          # compiler while everything shipped is built with the cross one.
          #
          # LINK_host and AR_host have to be named too, and the reason is a
          # fallback rather than a default. gyp's make generator resolves each
          # host tool as GetEnvironFallback(("<TOOL>_host", "<TOOL>"), default)
          # (tools/gyp/pylib/gyp/generator/make.py), so an unset LINK_host does
          # NOT fall back to $(CXX.host) - it falls back to LINK, which is set
          # just above to the CROSS linker. The host compiles then happen with
          # g++ and the host LINK with the cross compiler, which is what the
          # fifth run died of: node_js2c is a host tool built from obj.host
          # objects, and linking it ran "arm-linux-gnueabihf-g++ ... -m32" -
          # the host's own 32-bit flag handed to a compiler that has never
          # heard of it ("unrecognized command-line option '-m32'; did you mean
          # '-mbe32'?", and '-m64' in the loong64 container). AR_host had the
          # same fallback and was archiving host objects with the cross ar.
          #
          # --platform is what picks WHICH host: loong64 cross compiles from the
          # runner's own x86_64, but ARM32 has to be cross compiled from a
          # 32-bit x86 host (v8config.h - see the matrix), so its container is
          # an i386 one. Either way the CPU underneath is the runner's, and
          # nothing is emulated.
          docker run --rm --platform "${{ matrix.docker_platform || 'linux/amd64' }}" \
            -v "$PWD":/src -w /src \
            -e CC="${{ matrix.triple }}-gcc" \
            -e CXX="${{ matrix.triple }}-g++" \
            -e AR="${{ matrix.triple }}-ar" \
            -e RANLIB="${{ matrix.triple }}-ranlib" \
            -e LINK="${{ matrix.triple }}-g++" \
            -e CC_host=gcc -e CXX_host=g++ -e LINK_host=g++ -e AR_host=ar \
            ${{ matrix.image }} \
            sh -c '
              set -eu
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential python3 ninja-build ca-certificates \
                ${{ matrix.apt_packages }}
              ./configure ${{ matrix.configure_flags }}
              make -j"$(nproc)"
              ${{ matrix.triple }}-strip out/Release/node
            '

      # openssl's 32-bit Windows assembly is NASM syntax and the runner image
      # has no NASM, so the first run answered "Could not find NASM" and
      # configure quietly fell back to openssl_no_asm - a working binary with
      # the slow C implementations of every cipher. Installing it takes seconds
      # and gets the assembly back. continue-on-error because that fallback is
      # automatic (configure.py sets openssl_no_asm when nasm is missing): if
      # the install flakes, the build is slower, not broken.
      - name: Install NASM, so openssl keeps its assembly
        if: matrix.mode == 'windows'
        continue-on-error: true
        shell: cmd
        run: choco install nasm -y --no-progress

      - name: Build (Windows)
        if: matrix.mode == 'windows'
        shell: cmd
        run: |
          call vcbuild.bat ${{ matrix.vcbuild_arch }} clang-cl release
          if errorlevel 1 exit /b 1

      # x64 and arm64 on Linux, and both macOS builds, run on a runner that IS
      # the target CPU, so there is no container, no toolchain to install and no
      # cross flags - just configure and make, which is also the configuration
      # upstream builds these on.
      - name: Build (natively, on a runner of this CPU)
        if: matrix.mode == 'native' || matrix.mode == 'mac'
        run: |
          set -euo pipefail
          if [ '${{ matrix.mode }}' = 'native' ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              build-essential python3 ninja-build ca-certificates
            JOBS="$(nproc)"
          else
            # The macOS runners have Xcode and python3 already; ninja is the one
            # thing worth adding, and it is what upstream uses too.
            brew install ninja || true
            JOBS="$(sysctl -n hw.ncpu)"
          fi
          ./configure ${{ matrix.configure_flags }}
          make -j"$JOBS"
          strip out/Release/node 2>/dev/null || true

      - name: Name it for the release, and say what it is
        if: matrix.mode != 'windows'
        run: |
          set -euo pipefail
          mkdir -p dist
          cp out/Release/node "dist/node-${{ matrix.platform }}"
          chmod +x "dist/node-${{ matrix.platform }}"
          # `file` on the result is the one check worth having in the log: it is
          # how a build that quietly produced an x86_64 binary - because a
          # cross-compile flag was dropped - is caught before it is published as
          # an ARM one.
          file "dist/node-${{ matrix.platform }}"
          ls -l "dist/node-${{ matrix.platform }}"
          # A checksum beside the binary, so a consumer can tell a truncated or
          # tampered download from a good one. nodejs.org publishes a
          # SHASUMS256.txt and this fork published nothing, which is why WeKan's
          # build could verify an official download and not this one.
          ( cd dist && sha256sum "node-${{ matrix.platform }}" \
              > "node-${{ matrix.platform }}.sha256sum" )
          cat "dist/node-${{ matrix.platform }}.sha256sum"

      - name: Name it for the release (Windows)
        if: matrix.mode == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # `.exe`, like wekan/FerretDB's win32 asset: a Windows binary without
          # it is not executable by double-click and confuses every tool that
          # goes by extension.
          cp Release/node.exe "dist/node-${{ matrix.platform }}.exe"
          ls -l "dist/node-${{ matrix.platform }}.exe"
          ( cd dist && sha256sum "node-${{ matrix.platform }}.exe" \
              > "node-${{ matrix.platform }}.sha256sum" )
          cat "dist/node-${{ matrix.platform }}.sha256sum"

      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.platform }}
          path: dist/node-${{ matrix.platform }}*
          if-no-files-found: error
          retention-days: 7

  # Every binary that built, attached to the release of this version, with the
  # notes composed here. `always()` so two good platforms are still published
  # when a third fails - the release then simply lists the two it has.
  publish:
    name: attach to the release
    needs: build
    if: ${{ always() && inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve the version
        id: ver
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            # src/node_version.h is what the release commit for a version sets,
            # so this is always the version the branch actually is.
            MAJOR=$(sed -n 's/^#define NODE_MAJOR_VERSION \([0-9]*\).*/\1/p' src/node_version.h)
            MINOR=$(sed -n 's/^#define NODE_MINOR_VERSION \([0-9]*\).*/\1/p' src/node_version.h)
            PATCH=$(sed -n 's/^#define NODE_PATCH_VERSION \([0-9]*\).*/\1/p' src/node_version.h)
            V="v${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Release version: $V"

      - name: Compose the release notes
        id: notes
        env:
          # It asks the release what it already carries, so the notes describe
          # what will be downloadable rather than only what this run built.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          BARE="${V#v}"                 # 24.18.1
          MAJOR="${BARE%%.*}"           # 24

          # 1. Which platforms THIS RUN built. That is the whole list: the
          #    publish step below deletes every node-* asset this run did not
          #    produce, so a release carries exactly one run's binaries and
          #    "which build is this binary from" is never a question.
          #
          # `|| true`: when EVERY build fails there are no artifacts, dist/ does
          # not exist, and `ls` exits 2 - which under `set -e` killed this step
          # with a bare "Process completed with exit code 2" and no word about
          # what was actually wrong. The empty case is handled below, where it
          # can say so.
          # grep -v the checksum files: dist/ now holds node-i386 AND
          # node-i386.sha256sum, and only the first is a platform.
          present="$( (ls dist 2>/dev/null || true) | grep -v '\.sha256sum$' \
            | sed -n 's#^node-\(.*\)#\1#p' | sed 's#\.exe$##' | sort -u)"
          plats=""
          for a in x64 arm64 i386 armhf armv7 ppc64le s390x riscv64 loong64 win64 win32 mac-x64 mac-arm64; do
            printf '%s\n' "$present" | grep -qx "$a" && plats="${plats:+$plats }$a"
          done
          for a in $present; do
            printf ' %s ' "x64 arm64 i386 armhf armv7 ppc64le s390x riscv64 loong64 win64 win32 mac-x64 mac-arm64" | grep -q " $a " || plats="${plats:+$plats }$a"
          done
          if [ -z "$plats" ]; then
            echo "::error::No platform produced a binary - every build job failed. Their logs say why; nothing is published."
            exit 1
          fi
          # Comma-separated for the `Platforms:` line, which is the form the
          # FerretDB releases use; the sentence above it keeps the plain spaces
          # it is read as.
          plats_csv="$(printf '%s' "$plats" | sed 's/ /, /g')"

          # 2. The upstream release notes for this exact version, out of the
          #    changelog this fork carries. Sections are anchored
          #    `<a id="24.18.1"></a>` and run to the next `<a id="`, which is a
          #    firmer boundary than the `## <date>, Version ...` heading.
          CHANGELOG="doc/changelogs/CHANGELOG_V${MAJOR}.md"
          : > upstream-notes.md
          if [ -f "$CHANGELOG" ]; then
            awk -v ver="$BARE" '
              $0 ~ ("^<a id=\"" ver "\"></a>") { inblock=1; next }
              inblock && /^<a id="/ { exit }
              inblock { print }
            ' "$CHANGELOG" > upstream-notes.md
            sed -i -e '/./,$!d' upstream-notes.md
          fi
          if [ ! -s upstream-notes.md ]; then
            echo "::warning::No $CHANGELOG section for $BARE - the notes will carry the header only."
          fi

          # 3. The header xet7 asked for, then the platforms, then upstream's
          #    own notes for that version underneath.
          {
            echo "Node.js JavaScript runtime ✨🐢🚀✨"
            echo ""
            echo "$plats that are not at https://nodejs.org/dist/$V/ and https://unofficial-builds.nodejs.org/download/release/$V/"
            echo ""
            echo "Platforms: $plats_csv"
            echo ""
            echo "Built by node.yml from the wekan/node fork. One node-<platform> executable per platform, no archive. Every binary here is from the SAME run: re-running the workflow replaces what it rebuilds and removes what it does not, so a release never mixes builds."
            echo ""
            cat upstream-notes.md
          } > release-notes.md

          echo "----- release notes for $V -----"
          cat release-notes.md
          echo "notes_file=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create or update the release, with a binary per platform
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          NOTES_FILE="${{ steps.notes.outputs.notes_file }}"
          shopt -s nullglob
          assets=(dist/node-*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::No binaries were built - nothing to publish."
            exit 1
          fi
          # --clobber is half of what makes a re-run replace the last one: an
          # asset of the same name is overwritten in place rather than the
          # upload failing on it, so a fixed build can be published to the
          # release the broken one is attached to. The sweep below is the other
          # half - it removes the platforms this run did NOT build.
          # --target pins a NEW tag to the commit that was built rather than to
          # whatever the default branch has moved to since.
          if gh release view "$V" >/dev/null 2>&1; then
            gh release upload "$V" "${assets[@]}" --clobber
            gh release edit "$V" --title "$V" --notes-file "$NOTES_FILE"
          else
            gh release create "$V" "${assets[@]}" \
              --title "$V" \
              --target "${{ github.sha }}" \
              --notes-file "$NOTES_FILE"
          fi

          # Then take away everything this run did not produce, so the release
          # carries exactly ONE run's binaries.
          #
          # Without this a release accumulates: a platform that built in March
          # and has failed ever since keeps its March binary sitting beside
          # today's, indistinguishable from them, and "which run is this from"
          # becomes a question you cannot answer from the release page. Fixing a
          # build then means comparing against a binary whose provenance nobody
          # knows, which is the opposite of debugging.
          #
          # AFTER the upload, never before: if an upload fails, the release
          # keeps what it had rather than being emptied first and then not
          # refilled.
          #
          # Only `node-*` is swept. Anything else attached to the release was
          # put there by somebody on purpose and is not this workflow's to
          # remove.
          mine=""
          for a in "${assets[@]}"; do
            mine="$mine $(basename "$a")"
          done
          gh release view "$V" --json assets --jq '.assets[].name' \
            | grep '^node-' \
            | while read -r name; do
                if printf ' %s ' "$mine" | grep -q " $name "; then
                  continue
                fi
                echo "Deleting $name: not built by this run."
                gh release delete-asset "$V" "$name" --yes
              done
          echo "The release now carries exactly what this run built:"
          gh release view "$V" --json assets --jq '.assets[].name'
